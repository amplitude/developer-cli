openapi: 3.1.1
info:
  title: Amplitude Developer API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://amplitude.com/terms
  summary: OpenAPI-first contract for Amplitude CLI, MCP, SDK, and docs.
  description: |
    Public developer-facing API contract for Amplitude resources.
    This spec is intended to be the canonical source for generated CLI, MCP tools,
    SDKs, and documentation.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://developer-api.amplitude.com
    description: Production
  - url: https://developer-api.stag2.amplitude.com
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Projects
    description: Project discovery and project-scoped navigation.
  - name: Taxonomy Events
    description: Event taxonomy operations.
  - name: Taxonomy Event Properties
    description: Event-property taxonomy operations (scoped to an event).
  - name: Taxonomy User Properties
    description: User-property taxonomy operations (scoped to a project).
  - name: Analytics
    description: Saved chart discovery and query operations.
  - name: Feature Flags
    description: Feature flag configuration and rollout operations.
  - name: Destinations
    description: Destination (connection) catalog and CRUD operations.
  - name: Skills
    description: Skill documents for implementing Amplitude, intended for AI agents.
  - name: Auth
    description: OAuth device-flow and token endpoints (RFC 8628 / RFC 6749).
paths:
  /v1/auth/device-authorization:
    post:
      tags:
        - Auth
      operationId: deviceAuthorization
      summary: Start a device authorization request
      description: |
        RFC 8628 device authorization endpoint. Initiates the device flow and returns a device_code, user_code, and verification URIs for the user to approve out of band, then poll the token endpoint. When `offline_access` is requested, `openid` is also required.
      x-required-scopes: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '200':
          description: Device authorization started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
        '400':
          description: Invalid request (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          description: Server error (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /v1/auth/token:
    post:
      tags:
        - Auth
      operationId: token
      summary: Exchange a grant for tokens
      description: |
        RFC 6749 §3.2 token endpoint. Supports the `device_code` grant (RFC 8628) and the `refresh_token` grant. Authenticated by the fixed confidential device-flow client (injected server-side). Does not require a Bearer token.
      x-required-scopes: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or unsupported grant (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          description: Server error (RFC 6749 §5.2 OAuth error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /v1/context:
    get:
      tags:
        - Projects
      operationId: getContext
      summary: Get authenticated context
      description: Returns the authenticated principal and organization context.
      x-required-scopes:
        - projects:read
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - object
                      - principal
                      - org
                    properties:
                      object:
                        type: string
                        const: context
                      principal:
                        type: object
                        required:
                          - object
                          - login_id
                          - org_id
                          - auth_type
                          - scopes
                        properties:
                          object:
                            type: string
                            const: principal
                          login_id:
                            type: string
                          org_id:
                            type: string
                          org_name:
                            type:
                              - string
                              - 'null'
                          auth_type:
                            type: string
                            enum:
                              - oauth
                              - pat
                              - service_account
                              - api_key
                          scopes:
                            type: array
                            items:
                              type: string
                      org:
                        type: object
                        required:
                          - id
                          - object
                          - name
                        properties:
                          id:
                            type: string
                          object:
                            type: string
                            const: org
                          name:
                            type:
                              - string
                              - 'null'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects:
    get:
      tags:
        - Projects
      operationId: listProjects
      summary: List projects
      description: Returns projects visible to the authenticated principal.
      x-required-scopes:
        - projects:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/events/check-recent-ingestion:
    post:
      tags:
        - Analytics
      operationId: checkRecentEventIngestionByApiKey
      summary: Check recent event ingestion with an ingestion API key
      description: |
        Checks whether Amplitude received any events for the project associated
        with the supplied ingestion API key during the preceding eight hours.

        `observed` means at least one event was received in the evaluated window.
        `not_observed` means no events were received. `inconclusive` means no events
        were found, but the available data could not confirm their absence. Use the
        returned window when reporting or comparing results.

        The window uses server upload time: when Amplitude received each event,
        rather than the event time supplied by the sender.

        Provide `polling_timeout_seconds` to request server polling guidance.
        While another check is advised, successful responses include
        `poll_after_seconds`; its omission means clients should stop polling.
      x-required-scopes: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
              properties:
                api_key:
                  type: string
                  pattern: \S
                  description: Ingestion API key for the Amplitude project to check.
                polling_timeout_seconds:
                  $ref: '#/components/schemas/RecentEventIngestionPollingTimeoutSeconds'
              additionalProperties: false
      responses:
        '200':
          description: Recent event ingestion status for the evaluated window.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                      - window
                    properties:
                      status:
                        type: string
                        enum:
                          - observed
                          - not_observed
                          - inconclusive
                        description: |
                          `observed` when at least one event was received;
                          `not_observed` when none were received; `inconclusive`
                          when none were found but their absence could not be
                          confirmed.
                      poll_after_seconds:
                        $ref: '#/components/schemas/RecentEventIngestionPollAfterSeconds'
                      window:
                        type: object
                        required:
                          - lookback_hours
                          - start
                          - end
                          - basis
                        properties:
                          lookback_hours:
                            type: integer
                            const: 8
                            description: Number of hours evaluated.
                          start:
                            type: string
                            format: date-time
                            description: Start of the evaluated window.
                          end:
                            type: string
                            format: date-time
                            description: End of the evaluated window.
                          basis:
                            type: string
                            const: server_upload_time
                            description: |
                              The window is based on when Amplitude received each
                              event.
                        additionalProperties: false
                    additionalProperties: false
              example:
                data:
                  status: observed
                  window:
                    lookback_hours: 8
                    start: '2026-09-03T09:00:00Z'
                    end: '2026-09-03T17:00:00Z'
                    basis: server_upload_time
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: The supplied API key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://developer-api.amplitude.com/problems/invalid-api-key
                title: Invalid API key
                status: 401
                detail: The supplied API key is invalid.
                error_code: invalid_api_key
                retryable: false
        '403':
          description: The endpoint is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://developer-api.amplitude.com/problems/operation-not-enabled
                title: Endpoint unavailable
                status: 403
                detail: This endpoint is unavailable.
                error_code: operation_not_enabled
                retryable: false
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          description: |
            The ingestion status could not be determined. Retryable responses use
            `unreliable_dataset_response` or `upstream_error` as the `error_code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Endpoint not available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://developer-api.amplitude.com/problems/operation-availability-unavailable
                title: Endpoint not available
                status: 503
                detail: This endpoint is not available.
                error_code: operation_availability_unavailable
                retryable: true
  /v1/skills:
    get:
      tags:
        - Skills
      operationId: listSkills
      summary: List available skills
      description: Returns the skills currently available for implementing Amplitude, with each skill's name and when-to-use description.
      security: []
      responses:
        '200':
          description: Available skills.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - description
                      properties:
                        name:
                          type: string
                          description: Identifier used to retrieve the skill.
                        description:
                          type: string
                          description: When to use this skill.
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/skills/{name}:
    get:
      tags:
        - Skills
      operationId: getSkill
      summary: Get a skill document
      description: Returns the requested skill document verbatim as markdown, including frontmatter.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          description: Skill identifier as listed by `GET /v1/skills`.
          schema:
            type: string
      responses:
        '200':
          description: The requested skill document as markdown.
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/destination-types:
    get:
      tags:
        - Destinations
      operationId: listDestinationTypes
      summary: List destination partner types
      x-required-scopes:
        - destinations:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DestinationType'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/destination-types/{partner}:
    parameters:
      - $ref: '#/components/parameters/Partner'
    get:
      tags:
        - Destinations
      operationId: getDestinationType
      summary: Get destination partner type
      x-required-scopes:
        - destinations:read
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DestinationType'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/events:
    get:
      tags:
        - Taxonomy Events
      operationId: listEvents
      summary: List event taxonomy entries
      x-required-scopes:
        - taxonomy:read
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Taxonomy Events
      operationId: createEvent
      summary: Create event taxonomy entry
      x-required-scopes:
        - taxonomy:write
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
              properties:
                event_type:
                  type: string
                description:
                  type:
                    - string
                    - 'null'
              additionalProperties: false
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/events/check-recent-ingestion:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Analytics
      operationId: checkRecentEventIngestion
      summary: Check recent event ingestion
      description: |
        Checks whether events reached an Amplitude project during a recent time
        window. Provide `event_type` to check one exact event type, or omit it to
        check for any event. The default lookback is 10 minutes. The returned
        window can begin up to five minutes earlier so the evaluation covers the
        complete starting interval.

        `observed` means at least one matching event was found. `not_observed`
        means no matching event was found in the evaluated window. `inconclusive`
        means no matching event was found, but complete recent data was not
        available to confirm its absence. Use the returned window when reporting
        or comparing results.

        This POST computes a result and does not mutate state, so it does not
        require an `Idempotency-Key`.

        Provide `polling_timeout_seconds` to request server polling guidance.
        While another check is advised, successful responses include
        `poll_after_seconds`; its omission means clients should stop polling.
      x-required-scopes:
        - analytics:read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecentEventIngestionCheckRequest'
      responses:
        '200':
          description: Ingestion check completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecentEventIngestionCheck'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: |
            The caller cannot use this operation. `operation_not_enabled` means the
            operation is not enabled for the caller's organization;
            `insufficient_scope` means the token lacks `analytics:read`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                operationNotEnabled:
                  summary: Endpoint unavailable
                  value:
                    type: https://developer-api.amplitude.com/problems/operation-not-enabled
                    title: Endpoint unavailable
                    status: 403
                    detail: This endpoint is unavailable for your organization.
                    error_code: operation_not_enabled
                    retryable: false
                insufficientScope:
                  summary: Missing required scope
                  value:
                    type: https://developer-api.amplitude.com/problems/forbidden
                    title: Insufficient scope
                    status: 403
                    detail: Token missing required scopes.
                    error_code: insufficient_scope
                    retryable: false
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          description: |
            The ingestion status could not be determined. Retryable responses use
            `event_type_not_queryable`, `unreliable_dataset_response`, or
            `upstream_error` as the `error_code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Endpoint not available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                endpointNotAvailable:
                  summary: Endpoint not available
                  value:
                    type: https://developer-api.amplitude.com/problems/operation-availability-unavailable
                    title: Endpoint not available
                    status: 503
                    detail: This endpoint is not available.
                    error_code: operation_availability_unavailable
                    retryable: true
  /v1/projects/{project_id}/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags:
        - Taxonomy Events
      operationId: getEvent
      summary: Get event taxonomy entry
      x-required-scopes:
        - taxonomy:read
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Taxonomy Events
      operationId: updateEvent
      summary: Update event taxonomy entry
      x-required-scopes:
        - taxonomy:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type:
                    - string
                    - 'null'
                is_active:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Taxonomy Events
      operationId: deleteEvent
      summary: Soft-delete event taxonomy entry
      x-required-scopes:
        - taxonomy:write
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Event soft-deleted.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/events/{event_id}/event-properties:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags:
        - Taxonomy Event Properties
      operationId: listEventProperties
      summary: List event properties for an event
      description: |
        Returns properties bound to a specific event, including ingested-only
        properties (those with `is_in_schema: false`). Use the `is_in_schema`
        flag to detect whether a `PATCH` will succeed before issuing it.
      x-required-scopes:
        - taxonomy:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventProperty'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Taxonomy Event Properties
      operationId: createEventProperty
      summary: Create event property
      description: |
        Creates an event property and adds it to the project's tracking plan
        (`is_in_schema: true` after success). If the property already exists in
