        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - Destinations
      operationId: createDestination
      summary: Create a destination
      description: |
        Always creates a new destination; the server assigns the `id` used for
        every subsequent lookup. `display_name` is not an identity key, so
        repeating a create makes another destination. When `dry_run=true`, returns
        a plan envelope without mutating. SECRET/OAUTH config values are
        write-only.
      x-required-scopes:
        - destinations:write
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partner
                - display_name
              properties:
                partner:
                  type: string
                display_name:
                  type: string
                  minLength: 1
                kind:
                  type: array
                  items:
                    $ref: '#/components/schemas/DestinationConnectorKind'
                  minItems: 1
                  description: |
                    Optional connector kinds. When omitted, the kind is inferred
                    from the partner's capabilities; a multi-capability partner with
                    no kind is rejected as ambiguous. When provided it is
                    authoritative and validated against the partner. The three
                    families are mutually exclusive: a subset of [event, identify],
                    or [cohort], or [warehouse_export] — never combined.
                config:
                  type: object
                  additionalProperties: true
                enabled:
                  type: boolean
                event_filter:
                  $ref: '#/components/schemas/DestinationEventFilter'
                property_mappings:
                  type: object
                  additionalProperties: true
                send_events:
                  type: boolean
                send_users:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Dry-run plan (no mutation).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - plan
                properties:
                  data:
                    $ref: '#/components/schemas/Destination'
                  plan:
                    $ref: '#/components/schemas/PlanDetails'
        '201':
          description: Destination created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/destinations/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DestinationId'
    get:
      tags:
        - Destinations
      operationId: getDestination
      summary: Get a destination
      x-required-scopes:
        - destinations:read
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Destinations
      operationId: updateDestination
      summary: Update a destination
      x-required-scopes:
        - destinations:write
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                kind:
                  type: array
                  items:
                    $ref: '#/components/schemas/DestinationConnectorKind'
                  minItems: 1
                config:
                  type: object
                  additionalProperties: true
                enabled:
                  type: boolean
                event_filter:
                  oneOf:
                    - $ref: '#/components/schemas/DestinationEventFilter'
                    - type: 'null'
                property_mappings:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: 'null'
                send_events:
                  type: boolean
                send_users:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Destination updated, or dry-run plan.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Destination'
                  plan:
                    $ref: '#/components/schemas/PlanDetails'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/destinations/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DestinationId'
    post:
      tags:
        - Destinations
      operationId: testDestination
      summary: Test an event streaming destination connection
      x-required-scopes:
        - destinations:write
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DestinationTestResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/projects/{project_id}/snowflake-keys:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Destinations
      operationId: generateSnowflakeRsaKey
      summary: Generate an RSA key pair for Snowflake authentication
      description: |
        Generates a Snowflake-compatible RSA key pair. The private key is stored
        server-side in an ephemeral cache; you receive the public key (paste into
        your Snowflake user via `ALTER USER <user> SET RSA_PUBLIC_KEY = '...'`) and
        an ephemeral ID to pass as `snowflake_private_key_ephemeral_id` in the
        destination `config` on a subsequent `POST /destinations` for a Snowflake
        direct-load destination.

        This is the CLI equivalent of the "Generate RSA Key" step in the Amplitude
        UI wizard, so customers do not have to run `openssl genrsa` and manage
        private keys locally.
      x-required-scopes:
        - destinations:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Key pair generated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - public_key
                      - ephemeral_id
                    properties:
                      public_key:
                        type: string
                        description: RSA public key in PEM format. Add to your Snowflake user.
                      ephemeral_id:
                        type: string
                        description: Reference to the server-held private key. Pass as `snowflake_private_key_ephemeral_id` in destination create/update config.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Amplitude project identifier, backed by the canonical app ID.
      schema:
        type: string
        pattern: ^[0-9]+$
        example: '12345'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from `pagination.next_cursor` on the previous response.
        Numeric offsets are capped by the underlying search index (10,000 results
        per query). Well-formed pagination stops before that window; requests whose
        cursor would exceed it return 400 `pagination_not_supported`.
      schema:
        type:
          - string
          - 'null'
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items to return. Defaults to 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field. Prefix with `-` for descending. Supported values are `updated_at` and `name`.
      schema:
        type: string
        example: '-updated_at'
    Query:
      name: q
      in: query
      required: false
      description: Full-text search query.
      schema:
        type: string
    DryRun:
      name: dry_run
      in: query
      required: false
      description: Validate request without performing mutation.
      schema:
        type: boolean
        default: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique idempotency key used to safely retry write operations.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    EventId:
      name: event_id
      in: path
      required: true
      description: Public event identifier. For the current TMS-backed API, this value is the event type.
      schema:
        type: string
        minLength: 1
    EventPropertyId:
      name: event_property_id
      in: path
      required: true
      description: |
        Public event property identifier. Equal to `property_name`. URL-encode
        when the property name contains spaces or special characters.
      schema:
        type: string
        minLength: 1
    UserPropertyId:
      name: user_property_id
      in: path
      required: true
      description: |
        Public user property identifier. Equal to `property_name`. URL-encode
        when the property name contains spaces or special characters.
      schema:
        type: string
        minLength: 1
    FlagId:
      name: flag_id
      in: path
      required: true
      description: Feature flag identifier.
      schema:
        type: string
        minLength: 1
    ChartId:
      name: chart_id
      in: path
      required: true
      description: Saved chart identifier.
      schema:
        type: string
        minLength: 1
    ChartType:
      name: chart_type
      in: query
      required: false
      description: |
        Filter list results to a specific chart type. Use `unknown` to return charts
        whose type is not represented by a public API value.
      schema:
        $ref: '#/components/schemas/ChartType'
    IncludeDefinition:
      name: include_definition
      in: query
      required: false
      description: |
        When true, include the read-only chart definition on GET chart. The definition
        shape is unstable and not intended for authoring.
      schema:
        type: boolean
        default: false
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      description: Experiment identifier. Experiments are backed by flag configurations and use the same identifier namespace.
      schema:
        type: string
        minLength: 1
    Partner:
      name: partner
      in: path
      required: true
      description: Destination partner key (e.g. braze, kinesis_datastream).
      schema:
        type: string
        minLength: 1
    DestinationId:
      name: id
      in: path
      required: true
      description: Destination id.
      schema:
        type: string
        minLength: 1
    PartnerFilter:
      name: partner
      in: query
      required: false
      description: Filter by destination partner key.
      schema:
        type: string
        minLength: 1
    EnabledFilter:
      name: enabled
      in: query
      required: false
      description: Filter by enabled/active flag.
      schema:
        type: boolean
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optimistic concurrency token. Must equal the resource `version` for the
        write to proceed; otherwise the API returns 412.
      schema:
        type: integer
        minimum: 0
    KindFilter:
      name: kind
      in: query
      required: false
      description: |
        Filter by a single connector kind; matches destinations whose `kind` array
        contains this value.
      schema:
        $ref: '#/components/schemas/DestinationConnectorKind'
  responses:
    Problem:
      description: Error response encoded as RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Validation failure response encoded as RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitProblem:
      description: Request rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer-api.amplitude.com/problems/rate-limit-exceeded
            title: Rate limit exceeded
            status: 429
            detail: Too many requests.
            error_code: rate_limit_exceeded
            retryable: true
  schemas:
    ObjectMeta:
      type: object
      required:
        - id
        - object
        - created_at
        - updated_at
      properties:
        id:
          type: string
        object:
          type: string
          description: |
            Stable resource-type discriminator. Each resource sets a fixed value
            (declared via `const` on the concrete schema, e.g. `project`, `event`).
            Clients can use this field to safely narrow polymorphic responses.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: |
            Cursor for the next page, or `null` on the last page. Chart list
            responses may stop before all project charts are enumerated because
            the search backend caps each query at 10,000 sorted hits.
        has_more:
          type: boolean
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - error_code
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
            - string
            - 'null'
        instance:
          type:
            - string
            - 'null'
          format: uri
        error_code:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type:
            - integer
            - 'null'
          minimum: 0
        validation_errors:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
        - field
        - message
        - code
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    Project:
      allOf:
        - $ref: '#/components/schemas/ObjectMeta'
        - type: object
          required:
            - name
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            object:
              type: string
              const: project
              description: Resource-type discriminator. Always `project`.
            name:
              type: string
            description:
              type:
                - string
                - 'null'
    Event:
      type: object
      required:
        - id
        - object
        - project_id
        - event_type
        - display_name
        - is_active
      properties:
        id:
          type: string
          description: Canonical event identifier. Equal to `event_type`.
        object:
          type: string
          const: event
          description: Resource-type discriminator. Always `event`.
        project_id:
          type: string
          pattern: ^[0-9]+$
        event_type:
          type: string
        display_name:
          type: string
        description:
          type:
            - string
            - 'null'
        is_active:
          type: boolean
    EventProperty:
      type: object
      required:
        - id
        - object
        - project_id
        - event_type
        - property_name
        - is_hidden
        - is_in_schema
        - is_array_type
        - enum_values
        - classifications
      properties:
        id:
          type: string
          description: |
            Stable resource identifier. Equal to `property_name`.
        object:
          type: string
          const: event_property
          description: Resource-type discriminator. Always `event_property`.
        project_id:
          type: string
          pattern: ^[0-9]+$
        event_type:
          type: string
          description: Event this property is bound to.
        property_name:
          type: string
        description:
          type:
            - string
            - 'null'
        is_hidden:
          type: boolean
          description: Hidden from default UI surfaces and API listings.
        is_in_schema:
          type: boolean
          description: |
            Whether this property is part of the project's curated tracking
            plan. `false` means ingested-only (seen via SDK calls but never
            formally added). Properties with `is_in_schema: false` cannot be
            modified — `PATCH` returns `422 not_in_schema` and metadata writes
            are rejected. `POST` implicitly transitions a property to
            `is_in_schema: true`.
        data_type:
          $ref: '#/components/schemas/PropertyDataType'
        is_array_type:
          type: boolean
        enum_values:
          type: array
          items:
            type: string
        regex:
          type:
            - string
            - 'null'
        classifications:
          type: array
          items:
            type: string
          description: |
            Data Access Controls (DAC) tags. Examples include `PII`,
            `SENSITIVE`, `INTERNAL`.
    UserProperty:
      type: object
      required:
        - id
        - object
        - project_id
        - property_name
        - is_hidden
        - is_in_schema
        - is_array_type
        - enum_values
        - classifications
      properties:
        id:
          type: string
          description: |
            Stable resource identifier. Equal to `property_name`.
        object:
          type: string
          const: user_property
          description: Resource-type discriminator. Always `user_property`.
        project_id:
          type: string
          pattern: ^[0-9]+$
        property_name:
          type: string
        display_name:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        is_official:
          type:
            - boolean
            - 'null'
          description: |
            Curated/official flag. `null` ⇒ inherited / unset upstream.
        is_hidden:
          type: boolean
        is_in_schema:
          type: boolean
          description: |
            Whether this property is part of the project's curated tracking
            plan. Same semantics as `EventProperty.is_in_schema`.
        data_type:
          $ref: '#/components/schemas/PropertyDataType'
        is_array_type:
          type: boolean
        enum_values:
          type: array
          items:
            type: string
        regex:
          type:
            - string
            - 'null'
        classifications:
          type: array
          items:
            type: string
    PropertyDataType:
      description: |
        Logical data type of a property. `null` means untyped at the source;
        clients should treat it as `string` for ingestion.
      type:
        - string
        - 'null'
      enum:
        - string
        - number
        - boolean
        - object
        - enum
        - any
        - null
    Chart:
      type: object
      required:
        - id
        - object
        - project_id
        - name
        - chart_type
        - created_at
        - updated_at
        - url
        - archived
      properties:
        id:
          type: string
          description: Stable chart identifier.
        object:
          type: string
          const: chart
          description: Resource-type discriminator. Always `chart`.
        project_id:
          type: string
          pattern: ^[0-9]+$
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        chart_type:
          $ref: '#/components/schemas/ChartType'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          description: ISO-8601 creation time, or `null` when unavailable.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: ISO-8601 last-modified time, or `null` when unavailable.
        created_by:
          type:
            - string
            - 'null'
          description: |
            Chart creator. The creator's email when available, otherwise a login
            identifier; `null` when the creator cannot be resolved.
        url:
          type: string
          format: uri
          description: Deep link to the chart in the Amplitude UI.
        archived:
          type: boolean
          description: Whether the chart is archived.
        definition:
          type: object
          additionalProperties: true
          description: |
            Read-only chart definition. Returned only when `include_definition=true`
            on GET chart. Shape is unstable and may change between API versions;
            not intended for authoring.
    ChartType:
      type: string
      description: |
        Public chart type discriminator (snake_case). All values may appear on
        list/get; query returns `422` (`unsupported_chart_type`) for types outside
        the v1 supported matrix.

        Unsupported or unrecognized chart types are surfaced as `unknown`.

        New chart types may be added over time. Clients should treat `unknown` as
        "a chart type this API version does not model yet".
      enum:
        - event_segmentation
        - sessions
        - funnels
        - retention
        - composition
        - revenue_ltv
        - stickiness
        - data_table
        - engagement_matrix
        - metric_explorer
        - growth_accounting
        - impact
        - users
        - unknown
    ChartQueryRequest:
      type: object
      description: |
        v1 query parameters. Filter and group-by overrides are not supported in v1.
      properties:
        time_range:
          $ref: '#/components/schemas/TimeRange'
        timezone:
          type: string
          description: IANA timezone identifier (e.g. `America/New_York`).
          example: America/New_York
        exclude_incomplete_datapoints:
          type: boolean
          default: false
          description: |
            When true, excludes the current incomplete interval from results.
        group_by_limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
          description: Maximum number of breakdown groups returned per series.
        time_series_limit:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
          description: |
            Maximum number of time buckets per series. `0` collapses each series to
            a single scalar aggregate.
      additionalProperties: false
    AnalyticsResult:
      type: object
      required:
        - id
        - object
        - source_type
        - source_id
        - project_id
        - computed_at
        - timezone
        - result_kind
        - metric_semantics
        - data
        - metadata
        - warnings
      properties:
        id:
          type: string
          description: Identifier for this query execution.
        object:
          type: string
          const: analytics_result
          description: Resource-type discriminator. Always `analytics_result`.
        source_type:
          type: string
          enum:
            - chart
          description: |
            Source artifact type. v1 supports `chart` only. `dashboard` and `query`
            are reserved for future slices.
        source_id:
          type: string
          description: Identifier of the source chart.
        project_id:
          type: string
          pattern: ^[0-9]+$
        computed_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: IANA timezone used for computation.
        result_kind:
          $ref: '#/components/schemas/ResultKind'
        metric_semantics:
          $ref: '#/components/schemas/MetricSemantics'
        data:
          $ref: '#/components/schemas/AnalyticsResultData'
        metadata:
          $ref: '#/components/schemas/AnalyticsResultMetadata'
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal issues encountered during query execution.
        truncated:
          oneOf:
            - $ref: '#/components/schemas/TruncationInfo'
            - type: 'null'
    RecentEventIngestionCheckRequest:
      type: object
      properties:
        event_type:
          type: string
          pattern: \S
          description: Exact event type to check. Omit to check for any event.
        lookback_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 10
          description: |
            Number of recent minutes to evaluate. The returned window can begin up
            to five minutes earlier to cover the complete starting interval.
        polling_timeout_seconds:
          $ref: '#/components/schemas/RecentEventIngestionPollingTimeoutSeconds'
      additionalProperties: false
    RecentEventIngestionCheck:
      type: object
      required:
        - id
        - object
        - project_id
        - status
        - count
        - window
      properties:
        id:
          type: string
          description: Identifier for this ingestion check.
        object:
          type: string
          const: recent_event_ingestion_check
          description: Resource-type discriminator. Always `recent_event_ingestion_check`.
        project_id:
          type: string
          pattern: ^[0-9]+$
        event_type:
          type: string
          description: Event type evaluated. Omitted when the request checked for any event.
        status:
          type: string
          enum:
            - observed
            - not_observed
            - inconclusive
          description: |
            `observed` when at least one matching event was found; `not_observed`
            when none was found; `inconclusive` when none was found but complete
            recent data was unavailable.
        count:
          type: number
          minimum: 0
          description: Number of matching events found in the evaluated window.
        poll_after_seconds:
          $ref: '#/components/schemas/RecentEventIngestionPollAfterSeconds'
        window:
          type: object
          required:
            - start
            - end
            - basis
          properties:
            start:
              type: string
              format: date-time
              description: Start of the evaluated window.
            end:
              type: string
              format: date-time
              description: End of the evaluated window.
            basis:
              type: string
              const: server_upload_time
              description: |
                Time basis for the window. `server_upload_time` measures when an
                event reached Amplitude.
          additionalProperties: false
      additionalProperties: false
    FeatureFlag:
      allOf:
        - $ref: '#/components/schemas/FeatureFlagBase'
        - type: object
          required:
            - object
          properties:
            object:
              type: string
              const: feature_flag
              description: Resource-type discriminator. Always `feature_flag`.
    Variant:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Stable variant key. The value `off` is reserved.
        name:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        payload:
          description: Optional JSON payload returned by evaluation.
    TargetSegment:
      type: object
      required:
        - conditions
      properties:
        name:
          type:
            - string
            - 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TargetCondition'
        percentage:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
          description: Segment rollout percentage.
        rollout_weights:
          $ref: '#/components/schemas/RolloutWeights'
        bucketing_key:
          type:
            - string
            - 'null'
    TargetSegmentInput:
      type: object
      required:
        - percentage
        - rollout_weights
      properties:
        name:
          type:
            - string
            - 'null'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TargetCondition'
          description: Omitted (or empty) for the catch-all "all other users" segment.
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Segment rollout percentage.
        rollout_weights:
          $ref: '#/components/schemas/RolloutWeights'
        bucketing_key:
          type:
            - string
            - 'null'
    Destination:
      type: object
      required:
        - id
        - object
        - project_id
        - partner
        - display_name
        - kind
        - config
        - credential_status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Server-assigned identifier (read-only).
        object:
          type: string
          const: destination
        project_id:
          type: string
          pattern: ^[0-9]+$
        partner:
          type: string
        display_name:
          type: string
        kind:
          type: array
          items:
            $ref: '#/components/schemas/DestinationConnectorKind'
          minItems: 1
        config:
          type: object
          additionalProperties: true
          description: |
            Partner config keyed by parameter id. SECRET/OAUTH values are write-only
            and never returned on reads. Values are scalars or structured
            (objects/arrays, e.g. header maps); structured values round-trip as
            decoded JSON.
        credential_status:
          $ref: '#/components/schemas/DestinationCredentialStatus'
        version:
          type: integer
          minimum: 1
        enabled:
          type: boolean
          description: Event-streaming only. Whether the stream is enabled.
        paused:
          type: boolean
          description: Event-streaming only. Whether the stream is paused.
        event_filter:
          oneOf:
            - $ref: '#/components/schemas/DestinationEventFilter'
            - type: 'null'
          description: Event-streaming only. Events (and optional property filters) to stream.
        property_mappings:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: Event-streaming only. Optional property mappings.
        send_events:
          type: boolean
          description: Event-streaming only. Whether to send events.
        send_users:
          type: boolean
          description: Event-streaming only. Whether to send identify/user updates.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type:
            - string
            - 'null'
        updated_by:
          type:
            - string
            - 'null'
    DestinationType:
      type: object
      required:
        - id
        - object
        - partner
        - display_name
        - types
        - parameters
      properties:
        id:
          type: string
        object:
          type: string
          const: destination_type
        partner:
          type: string
          description: Partner key (e.g. braze, kinesis_datastream, s3).
        display_name:
          type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/DestinationConnectorType'
          minItems: 1
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/DestinationParameter'
    DestinationParameter:
      type: object
      required:
        - id
        - label
        - kind
        - required
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          $ref: '#/components/schemas/DestinationParameterKind'
        required:
          type: boolean
        description:
          type:
            - string
            - 'null'
        enum_values:
          type: array
          items:
            type: string
        write_only:
          type: boolean
    PlanDetails:
      type: object
      required:
        - action
        - dry_run
      properties:
        action:
          $ref: '#/components/schemas/PlanAction'
        dry_run:
          type: boolean
          const: true
        diff:
          oneOf:
            - type: object
              additionalProperties:
                $ref: '#/components/schemas/PlanDiffEntry'
            - type: 'null'
        warnings:
          type: array
          items:
            type: string
    DeviceAuthorizationRequest:
      type: object
      properties:
        scope:
          type: string
          description: |
            Space-delimited OAuth scopes to request. When `offline_access` is requested, `openid` is also required.
    DeviceAuthorizationResponse:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
    OAuthError:
      type: object
      description: RFC 6749 §5.2 OAuth error response.
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
        error_hint:
          type: string
        error_uri:
          type: string
    TokenRequest:
      description: |
        Token grant request. Either the `device_code` grant (RFC 8628) or the `refresh_token` grant, selected by `grant_type`.
      oneOf:
        - $ref: '#/components/schemas/DeviceCodeTokenRequest'
        - $ref: '#/components/schemas/RefreshTokenRequest'
      discriminator:
        propertyName: grant_type
        mapping:
          urn:ietf:params:oauth:grant-type:device_code: '#/components/schemas/DeviceCodeTokenRequest'
          refresh_token: '#/components/schemas/RefreshTokenRequest'
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
        id_token:
          type: string
    DeviceCodeTokenRequest:
      type: object
      required:
        - grant_type
        - device_code
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:device_code
          description: The OAuth grant type. Must be `urn:ietf:params:oauth:grant-type:device_code`.
        device_code:
          type: string
          description: The device_code from the device-authorization response.
    RefreshTokenRequest:
      type: object
      required:
        - grant_type
        - refresh_token
      properties:
        grant_type:
          type: string
          const: refresh_token
          description: The OAuth grant type. Must be `refresh_token`.
        refresh_token:
          type: string
          description: The refresh_token issued by a previous token or refresh grant.
    RecentEventIngestionPollingTimeoutSeconds:
      type: integer
      minimum: 1
      maximum: 120
      description: |
        Maximum polling window requested by the caller. Clients should complete
        the initial check even if it exceeds this window and use the window only
        to limit subsequent polls. Its presence requests polling guidance; it is
        not an HTTP request timeout, and each HTTP request performs one check.
    RecentEventIngestionPollAfterSeconds:
      type: integer
      minimum: 1
      description: |
        Minimum seconds to wait before the next ingestion check. Returned only
        when polling was requested and another check is advised. Its omission
        means the server does not advise another check.
    DestinationConnectorType:
      type: string
      enum:
        - event
        - identify
        - cohort
    DestinationParameterKind:
      type: string
      enum:
        - string
        - number
        - boolean
        - secret
        - oauth
        - service_account
        - enum
        - http_headers
        - mapped_field
        - event_mapping
        - transformation
        - ads_account
    TimeRange:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date
          description: Inclusive start date (project timezone unless `timezone` is set on query).
        end:
          type: string
          format: date
          description: Inclusive end date.
      additionalProperties: false
    ResultKind:
      type: string
      description: |
        High-level shape of the normalized result payload. Adapters set this
        explicitly per supported chart type; `unknown` means the server could not
        classify the result shape safely.
      enum:
        - timeseries
        - scalar
        - funnel
        - retention
        - table
        - unknown
    RecommendedAggregate:
      type: string
      description: |
        Recommended aggregation method for downstream consumers. Non-additive metrics
        (e.g. unique users) must not be summed across intervals. `unknown` is used
        when the adapter cannot determine a safe aggregate; treat values as
        non-additive in that case.
      enum:
        - sum
        - last
        - mean
        - deduped_total
        - none
        - unknown
    MetricSemantics:
      type: object
      required:
        - additive
        - recommended_aggregate
      properties:
        additive:
          type: boolean
          description: |
            When false, values must not be summed across time intervals or groups
            without understanding deduplication semantics.
        recommended_aggregate:
          $ref: '#/components/schemas/RecommendedAggregate'
        notes:
          type:
            - string
            - 'null'
          description: Human-readable guidance for interpreting values.
    ResultDimension:
      type: object
      required:
        - id
        - label
        - role
      properties:
        id:
          type: string
        label:
          type: string
        role:
          type: string
          enum:
            - time
            - segment
            - breakdown
            - step
          description: Role of this dimension in the result.
    ResultPoint:
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          description: Dimension value (typically an ISO date or category label).
          oneOf:
            - type: string
            - type: number
        'y':
          type:
            - number
            - 'null'
          description: Metric value at this point.
        complete:
          type: boolean
          description: |
            When false, the interval is incomplete (current bucket). Only present
            when `exclude_incomplete_datapoints` is false.
    ResultSeries:
      type: object
      required:
        - id
        - label
        - points
      properties:
        id:
          type: string
        label:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/ResultPoint'
        aggregate:
          type: object
          description: Optional pre-computed aggregate for the series.
          properties:
            value:
              type:
                - number
                - 'null'
            method:
              type: string
          required:
            - value
            - method
    AnalyticsResultData:
      type: object
      description: |
        Normalized result payload. Populated fields depend on `result_kind`.
        Timeseries and funnel results use `dimensions` and `series`. Table results
        use `columns` and `rows`.
      properties:
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/ResultDimension'
        series:
          type: array
          items:
            $ref: '#/components/schemas/ResultSeries'
        columns:
          type: array
          items:
            type: string
          description: Column headers for table-shaped results.
        rows:
          type: array
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: number
                - type: boolean
                - type: 'null'
    AnalyticsResultMetadata:
      type: object
      description: Echo of effective query parameters and chart context.
      properties:
        chart_type:
          $ref: '#/components/schemas/ChartType'
        chart_name:
          type: string
        time_range:
          $ref: '#/components/schemas/TimeRange'
        exclude_incomplete_datapoints:
          type: boolean
        group_by_limit:
          type: integer
        time_series_limit:
          type: integer
      additionalProperties: true
    TruncationInfo:
      type: object
      properties:
        group_by_limit:
          type: integer
          description: Applied group-by limit when breakdown was truncated.
        time_series_limit:
          type: integer
          description: Applied time-series limit when buckets were truncated.
        reason:
          type: string
          description: Human-readable explanation of truncation.
    RolloutWeights:
      type: object
      additionalProperties:
        type: number
        minimum: 0
      description: 'Variant-keyed rollout weights. Values may be normalized to sum to 100 (percentages) or expressed as unnormalized relative weights (for example `{ "control": 1, "treatment": 1 }` for an even split). Weights are non-negative and may be fractional.'
    TargetCondition:
      type: object
      required:
        - prop
        - op
        - type
        - values
      properties:
        group_type:
          type:
            - string
            - 'null'
        prop:
          type: string
          minLength: 1
          description: Property name or cohort identifier being targeted.
        prop_type:
          type:
            - string
            - 'null'
          description: Namespace of the targeted property, for example `user`, `event`, or `group`. Omitted for conditions that target a cohort rather than a property.
        op:
          type: string
          description: Targeting operator applied to the property values.
          enum:
            - is
            - is not
            - contains
            - does not contain
            - less
            - less or equal
            - greater
            - greater or equal
            - set is
            - set is not
            - set contains
            - set does not contain
            - glob match
            - glob does not match
        type:
          type: string
          description: Condition type, for example `property` or `cohort`.
        values:
          type: array
          minItems: 1
          items:
            type: string
          description: At least one value to match against. Conditions with no values are rejected.
    Tester:
      type: object
      required:
        - variant_key
        - values
      properties:
        variant_key:
          type: string
        values:
          type: array
          items:
            type: string
          maxItems: 2000
          description: User IDs, device IDs, or cohort identifiers included in this variant. At most 2000 entries per variant (the limit is 10 when the entries are cohort identifiers).
    ParentDependency:
      type: object
      required:
        - flag_id
      properties:
        flag_id:
          type: string
        allowed_variants:
          type: array
          items:
            type: string
    ParentDependencies:
      type: object
      required:
        - operator
        - flags
      properties:
        operator:
          type: string
          enum:
            - all
            - any
        flags:
          type: array
          items:
            $ref: '#/components/schemas/ParentDependency'
    Link:
      type: object
      required:
        - url
        - title
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
    FeatureFlagBase:
      type: object
      required:
        - id
        - project_id
        - key
        - name
        - enabled
        - evaluation_mode
        - variants
        - bucketing_key
        - rollout_percentage
        - rollout_weights
        - target_segments
        - version
        - archived
        - tags
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          pattern: ^[0-9]+$
          readOnly: true
        key:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        deployments:
          type: array
          items:
            type: string
          readOnly: true
          description: Deployment IDs associated with this flag. Managed via the create/update deployment fields, not set directly on this field.
        enabled:
          type: boolean
        evaluation_mode:
          type: string
          enum:
            - local
            - remote
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        bucketing_key:
          type: string
          description: Bucketing key used for assignment. Never null in responses; defaults to `amplitude_id` when not explicitly set.
        bucketing_salt:
          type:
            - string
            - 'null'
          readOnly: true
        bucketing_unit:
          type:
            - string
            - 'null'
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
        rollout_weights:
          $ref: '#/components/schemas/RolloutWeights'
        target_segments:
          type: array
          items:
            $ref: '#/components/schemas/TargetSegment'
        testers:
          type: array
          items:
            $ref: '#/components/schemas/Tester'
        owners:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        created_by:
          type:
            - string
            - 'null'
          readOnly: true
        last_modified_by:
          type:
            - string
            - 'null'
          readOnly: true
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
        parent_dependencies:
          allOf:
            - $ref: '#/components/schemas/ParentDependencies'
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        version:
          type: integer
          readOnly: true
          description: Server-managed config version used for optimistic concurrency.
        archived:
          type: boolean
          readOnly: true
          description: Whether the resource is archived. Set via the archive (DELETE) operation.
        url:
          type:
            - string
            - 'null'
          format: uri
          readOnly: true
    DestinationConnectorKind:
      type: string
      enum:
        - event
        - identify
        - cohort
        - warehouse_export
      description: |
        Authoritative connector kind on a destination. `event`/`identify`/`cohort`
        are Connector-Manager routed; `warehouse_export` is Falcon routed. Routing
        is derived from the array of these values, so there is no separate routing
        field. `warehouse_export` cannot be combined with the other kinds.
    DestinationCredentialStatus:
      type: string
      enum:
        - connected
        - disconnected
        - expired
    DestinationEventFilter:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            type: string
          minItems: 1
        property_filters:
          type: object
          additionalProperties: true
    PlanAction:
      type: string
      enum:
        - create
        - update
        - noop
    PlanDiffEntry:
      type: object
      required:
        - from
        - to
      properties:
        from: {}
        to: {}
    DestinationTestResult:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        detail:
          type:
            - string
            - 'null'
        example_payload:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
